steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/seekreap-worker', '.']

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/seekreap-worker']

  # Deploy as a Cloud Run Job with Neon environment variables
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'seekreap-worker'
      - '--image'
      - 'gcr.io/$PROJECT_ID/seekreap-worker'
      - '--region'
      - 'us-central1'
      - '--tasks'
      - '1'
      - '--max-retries'
      - '3'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1000m'
      - '--set-env-vars'
      - 'DB_HOST=ep-rapid-base-ai27r1sa-pooler.c-4.us-east-1.aws.neon.tech,DB_PORT=5432,DB_NAME=seekreap_neon_db,DB_USER=neondb_owner,DB_PASSWORD=npg_yX7aHMwIqQC4,DB_SSLMODE=require'

# Keep the log bucket fix
options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET

images:
  - 'gcr.io/$PROJECT_ID/seekreap-worker'
