steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/seekreap-worker:$SHORT_SHA', '.']

  # Step 2: Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/seekreap-worker:$SHORT_SHA']

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'seekreap-worker'
      - '--image'
      - 'gcr.io/$PROJECT_ID/seekreap-worker:$SHORT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--set-env-vars'
      - 'DATABASE_URL=${_DATABASE_URL},TIER3_URL=${_TIER3_URL},TIER4_URL=${_TIER4_URL}'

# Store images in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/seekreap-worker:$SHORT_SHA'

# Substitutions for environment variables
substitutions:
  _DATABASE_URL: 'postgresql://neondb_owner:npg_yX7aHMwIqQC4@ep-rapid-base-ai27r1sa-pooler.c-4.us-east-1.aws.neon.tech:5432/seekreap_neon_db?sslmode=require'
  _TIER3_URL: 'https://seekreap-tier3-tif2gmgi4q-uc.a.run.app'
  _TIER4_URL: 'https://seekreap-tier4-tif2gmgi4q-uc.a.run.app'

options:
  logging: GCS_ONLY
  machineType: 'E2_HIGHCPU_8'
  logStreamingOption: STREAM_ON
  env:
    - 'CLOUDSDK_COMPUTE_REGION=us-central1'

logsBucket: 'gs://seekreap-production_cloudbuild'
